name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bigmart-demand .
      - name: smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 bigmart-demand
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break || sleep 2; done
          curl -fs -X POST localhost:8000/predict -H 'content-type: application/json' -d '{"item_identifier":"FDA15","item_type":"Dairy","item_mrp":249.81,"item_weight":9.3,"item_fat_content":"Low Fat","item_visibility":0.016,"outlet_identifier":"OUT049","outlet_establishment_year":1999,"outlet_size":"Medium","outlet_location_type":"Tier 1","outlet_type":"Supermarket Type1"}'
